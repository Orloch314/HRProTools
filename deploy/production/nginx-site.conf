server {
    listen 80;
    server_name hrprotools.com www.hrprotools.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/hrprotools/acme; }
    location / { return 308 https://hrprotools.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.hrprotools.com;
    ssl_certificate /etc/letsencrypt/live/hrprotools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrprotools.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://hrprotools.com$request_uri;
}
server {
    listen 443 ssl;
    server_name hrprotools.com;
    ssl_certificate /etc/letsencrypt/live/hrprotools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrprotools.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/hrprotools/site;
    location / { try_files $uri $uri/ =404; }
    location /_astro/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location ~ /\. { deny all; }
}
